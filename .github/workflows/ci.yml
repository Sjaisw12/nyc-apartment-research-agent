name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (offline tests, lint, benchmark replay)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # CI never calls the live NYC APIs and needs no secrets.
      RUN_LIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Offline test suite
        run: uv run pytest -q

      - name: 24-address benchmark (offline replay of recorded responses)
        run: uv run python scripts/evaluate_resolver.py
