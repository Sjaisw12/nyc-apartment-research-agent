# Local PostgreSQL 16 for development and the database tests (Phase 2 Task 4).
# The password is for this disposable local container only; never reuse it.
#   docker compose up -d db
#   export TEST_DATABASE_ADMIN_URL=postgresql://postgres:local-dev-only@localhost:5432/postgres
#   cd backend && uv run pytest -m db
services:
  # Research API in offline demo mode: docker compose up api  (http://localhost:8000)
  api:
    build: ./backend
    environment:
      DATA_MODE: ${DATA_MODE:-demo}
      LLM_ENABLED: ${LLM_ENABLED:-0}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "127.0.0.1:8000:8000"
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
